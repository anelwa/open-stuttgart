name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bei Dokploy auslösen
        run: |
          curl -sS -X POST "https://deploy.stawa-studio.com/api/deploy/${{ secrets.DOKPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main","repository":{"full_name":"anelwa/open-stuttgart"},"head_commit":{"id":"${{ github.sha }}","message":"Deployment von GitHub Actions"}}' \
            -w '\nhttp-status: %{http_code}\n'
