# Pilotbetrieb: Offenes Veranstaltungsregister Stuttgart (Gancio 1.28.2)
# Vorbereitung:
#   cp config.json.example config.json
#   mkdir -p data/uploads data/plugins
#   docker compose up -d
# Danach Oberfläche unter http://localhost:13120 öffnen und in Open Stuttgart mit
#   OS_GANCIO_URL=http://localhost:13120 npm start
# anbinden.

services:
  gancio:
    image: cisti/gancio:1.28.2
    container_name: open-stuttgart-gancio
    restart: unless-stopped
    ports:
      - "127.0.0.1:13120:13120"
    environment:
      - TZ=Europe/Berlin
      - NODE_ENV=production
    volumes:
      - ./config.json:/config.json:ro
      - ./data:/data
      - ./user_locale:/app/user_locale:ro
    command: ["start", "--config", "/config.json"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13120/api/events?max=1"]
      interval: 30s
      timeout: 5s
      retries: 3
