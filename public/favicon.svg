<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Open Stuttgart: Silhouette aus Stiftskirche, Neuem Schloss und Fernsehturm im Talkessel -->
  <defs>
    <clipPath id="r">
      <rect width="64" height="64" rx="16"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="#FFB300"/>
  <g clip-path="url(#r)">
    <g fill="#26262C">
      <!-- 1. Stiftskirche (links: ungleiches Turmpaar mit Westturm, Kirchenschiff und spitzem Chorturm) -->
      <path d="M 7.5 53 L 7.5 32.5 L 8.3 32.5 L 8.3 25.5 L 9.5 25.5 L 9.5 24.5 L 12.5 24.5 L 12.5 25.5 L 13.7 25.5 L 13.7 32.5 L 14.5 32.5 L 14.5 38.5 L 17.2 35.2 L 19.8 38.5 L 19.8 30.5 L 21.8 20.5 L 23.8 30.5 L 23.8 53 Z"/>

      <!-- 2. Neues Schloss (Mitte: Mittelpavillon mit Barockkuppel, Laterne und Giebelportikus) -->
      <path d="M 33.7 32.8 L 34.5 29.8 L 35.3 32.8 Z"/>
      <path d="M 28.6 38.8 C 28.6 34.4 31.2 32.4 34.5 32.4 C 37.8 32.4 40.4 34.4 40.4 38.8 Z"/>
      <path d="M 26.0 41.5 L 34.5 37.0 L 43.0 41.5 L 42.3 41.5 L 42.3 53 L 26.7 53 L 26.7 41.5 Z"/>

      <!-- 3. Stuttgarter Fernsehturm (rechts auf der Hanghöhe: Antenne, Plattform, konischer Turmkorb, Schaft) -->
      <rect x="51.0" y="5.0" width="1.0" height="7.5" rx="0.5"/>
      <rect x="50.5" y="12.0" width="2.0" height="5.8"/>
      <rect x="46.8" y="17.5" width="9.4" height="1.5" rx="0.6"/>
      <path d="M 45.8 19.0 L 57.2 19.0 L 55.8 27.4 L 47.2 27.4 Z"/>
      <path d="M 48.2 27.4 L 54.8 27.4 L 54.2 29.2 L 48.8 29.2 Z"/>
      <path d="M 50.1 29.2 L 52.9 29.2 L 54.1 48.5 L 48.9 48.5 Z"/>

      <!-- Talkessel-Hanglinie und Sockel -->
      <path d="M 0 49.5 C 7 49.8 13 52.0 29 52.0 C 41 52.0 48 47.5 64 44.5 L 64 64 L 0 64 Z"/>
    </g>

    <!-- Feine Negativ-Details in Stuttgarter Gelb (#FFB300) -->
    <g fill="#FFB300">
      <!-- Stiftskirche: Turmuhr und Maßwerkfenster -->
      <circle cx="11.0" cy="28.6" r="1.35"/>
      <rect x="10.25" y="34.2" width="1.5" height="4.6" rx="0.75"/>
      <rect x="21.1" y="33.2" width="1.4" height="4.2" rx="0.7"/>

      <!-- Neues Schloss: Kolonnaden-/Fensterachsen -->
      <rect x="28.7" y="42.8" width="1.5" height="5.6" rx="0.75"/>
      <rect x="32.0" y="42.8" width="1.5" height="5.6" rx="0.75"/>
      <rect x="35.5" y="42.8" width="1.5" height="5.6" rx="0.75"/>
      <rect x="38.8" y="42.8" width="1.5" height="5.6" rx="0.75"/>

      <!-- Fernsehturm: Fensterbänder im Turmkorb -->
      <rect x="47.4" y="20.7" width="8.2" height="1.4" rx="0.5"/>
      <rect x="47.9" y="23.5" width="7.2" height="1.3" rx="0.5"/>
    </g>

    <!-- Dezente Höhenlinie des Talkessels im Sockel -->
    <path d="M 4 56.5 C 14 57.0 21 58.5 31 58.5 C 43 58.5 51 54.2 60 52.0" fill="none" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
